<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Конспект">
<title>Конспект</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
:root{--bg:#0f172a;--card:#1e293b;--btn:#334155;--btn-h:#475569;--text:#e2e8f0;--dim:#94a3b8;--mid:#cbd5e1;--bright:#f1f5f9;--acc:#2563eb;--acc-h:#1d4ed8;--bd:#475569;--ok:#16a34a;--warn:#dc2626;--key-bg:#1e3a8a;--key-bd:#3b82f6;--key-t:#dbeafe;--input:#0f172a;--input-bd:#475569;--danger:#dc2626;--today-bd:#ea580c}
body.light{--bg:#f1f5f9;--card:#fff;--btn:#e2e8f0;--btn-h:#cbd5e1;--text:#0f172a;--dim:#64748b;--mid:#475569;--bright:#0f172a;--bd:#cbd5e1;--key-bg:#dbeafe;--key-bd:#2563eb;--key-t:#1e3a8a;--input:#fff;--input-bd:#cbd5e1}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;font-size:clamp(15px,4.2vw,17px);line-height:1.6;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);transition:.2s}
.wrap{max-width:820px;margin:0 auto;padding:clamp(12px,3.5vw,18px)}
h1{font-size:clamp(20px,5.5vw,24px);margin:4px 0 16px}
h2{font-size:clamp(17px,4.6vw,19px);margin:0 0 10px}
h3{font-size:clamp(16px,4.3vw,18px);margin:20px 0 8px;color:var(--bright);padding-bottom:4px;border-bottom:1px solid var(--bd)}
h4{font-size:clamp(15px,4vw,16.5px);margin:14px 0 6px;color:var(--bright)}
.mh{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;gap:10px;flex-wrap:wrap}
.mh h1{margin:0}
.hr{display:flex;gap:8px;align-items:center}
.ic{background:var(--btn);border:none;border-radius:10px;font-size:18px;padding:8px 12px;cursor:pointer;color:var(--text);line-height:1;flex-shrink:0}
.ic.active{background:var(--acc);color:#fff}
.c{background:var(--card);border-radius:14px;padding:clamp(14px,4vw,20px);margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);overflow-wrap:break-word}
.b{display:block;width:100%;padding:13px 16px;margin:8px 0;background:var(--btn);color:var(--text);border:none;border-radius:10px;font-size:clamp(14.5px,4vw,16px);line-height:1.4;text-align:left;cursor:pointer;transition:.15s;font-family:inherit;min-height:48px;overflow-wrap:break-word}
.b:hover{background:var(--btn-h)}
.b.pr{background:var(--acc);text-align:center;font-weight:600;color:#fff}
.b.pr:hover{background:var(--acc-h)}
.b.dg{background:var(--danger);text-align:center;color:#fff}
.b.bk{background:transparent;color:var(--dim);text-align:center}
.b.sm{min-height:34px;padding:6px 10px;font-size:clamp(12.5px,3.5vw,13.5px);margin:3px 0}
.b.cn{text-align:center}
.r{display:flex;gap:8px;flex-wrap:wrap}
.r .b{flex:1;text-align:center;min-width:80px}
.m{font-size:clamp(12px,3.4vw,13.5px);color:var(--dim);margin-bottom:8px}
.bdg{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--btn);font-size:clamp(11px,3.1vw,12px);color:var(--mid);margin:2px 4px 2px 0}
.bdg.td{background:#7c2d12;color:#fed7aa;font-weight:700}
.ctr{text-align:center}
.tb{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tb .bb{background:var(--btn);color:var(--text);border:none;border-radius:10px;padding:8px 14px;font-size:18px;cursor:pointer;font-family:inherit;min-height:40px;min-width:44px;display:flex;align-items:center;justify-content:center;line-height:1}
.tb .t{flex:1;font-size:clamp(12px,3.4vw,14px);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:var(--btn);color:var(--mid);padding:12px;border-radius:10px;font-size:13.5px;margin-bottom:12px;line-height:1.5}
.in{width:100%;padding:13px 15px;font-size:clamp(15px,4vw,16px);background:var(--input);border:1.5px solid var(--input-bd);color:var(--text);border-radius:10px;font-family:inherit;margin-bottom:10px;-webkit-appearance:none}
.in:focus{outline:none;border-color:var(--acc)}
.ta{width:100%;min-height:100px;padding:13px 15px;font-size:clamp(14.5px,3.8vw,15.5px);background:var(--input);border:1.5px solid var(--input-bd);color:var(--text);border-radius:10px;font-family:inherit;margin-bottom:10px;line-height:1.6;resize:vertical;-webkit-appearance:none}
.ta:focus{outline:none;border-color:var(--acc)}
.lbl{display:block;font-size:clamp(13px,3.6vw,14.5px);color:var(--mid);margin-bottom:6px;margin-top:8px}
.ic2{background:var(--card);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid transparent;transition:.15s}
.ic2.cl{cursor:pointer}
.ic2.cl:hover{border-color:var(--bd)}
.ic2 .it{font-size:clamp(15px,4.2vw,16.5px);font-weight:600;line-height:1.4;color:var(--bright);margin-bottom:4px}
.ic2 .is{font-size:clamp(12px,3.4vw,13.5px);color:var(--dim);line-height:1.4}
.es{text-align:center;padding:40px 20px;color:var(--dim);font-size:15px}
.es .be{font-size:48px;margin-bottom:12px;display:block}
.tc{font-size:clamp(14.5px,4vw,16px);line-height:1.7;color:var(--mid)}
.tc p{margin:10px 0}
.tc .kb{background:var(--key-bg);border-left:4px solid var(--key-bd);padding:12px 14px;border-radius:8px;margin:14px 0;color:var(--key-t);font-weight:500}
.tc ul{padding-left:22px;margin:8px 0}
.tc li{margin:4px 0}
.tc img{max-width:100%;border-radius:8px;margin:12px 0;display:block}
.tc blockquote{background:var(--key-bg);border-left:4px solid var(--key-bd);padding:12px 14px;border-radius:8px;margin:14px 0;color:var(--key-t);font-weight:500}
.tc strong{color:var(--bright)}
.tc em{color:var(--acc);font-style:normal;font-weight:500}
.tc code{background:var(--btn);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:.92em}
.tc hr{border:none;border-top:1px solid var(--bd);margin:20px 0}
.sd{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--bd)}
.sd.td{border-left-color:var(--today-bd)}
.sdh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.sdt{font-size:clamp(15px,4.2vw,16.5px);font-weight:700;color:var(--bright)}
.sdd{font-size:clamp(11.5px,3.2vw,13px);color:var(--dim)}
.sl{display:flex;gap:10px;padding:6px 0;font-size:clamp(13.5px,3.8vw,15px);line-height:1.45;border-bottom:1px dashed var(--bd)}
.sl:last-child{border-bottom:none}
.st{min-width:96px;color:var(--dim);font-size:clamp(12px,3.4vw,13.5px);font-variant-numeric:tabular-nums;flex-shrink:0}
.ss2{flex:1;color:var(--text)}
.se{padding:6px 0;color:var(--dim);font-size:clamp(13px,3.6vw,14px);font-style:italic}
.rr{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:clamp(13.5px,3.8vw,15px)}
.rr:last-child{border-bottom:none}
.rt{min-width:130px;color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.rw{flex:1;color:var(--text)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:1000;overflow-y:auto}
.md{background:var(--card);border-radius:14px;padding:20px;max-width:620px;width:100%;max-height:92vh;overflow-y:auto;margin:auto}
.md h3{margin-top:0;border:none;padding:0;font-size:clamp(17px,4.6vw,19px)}
.ma{display:flex;gap:8px;margin-top:12px;position:sticky;bottom:0;background:var(--card);padding-top:10px;padding-bottom:4px}
.ma .b{flex:1;text-align:center}
.sp{display:inline-block;width:18px;height:18px;border:2px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.hd{display:none!important}
.editor-toolbar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;padding:8px;background:var(--btn);border-radius:10px}
.editor-toolbar button{background:var(--card);border:none;border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--text);font-size:13px;font-family:inherit;min-height:32px}
.editor-toolbar button:hover{background:var(--btn-h)}
.editor-toolbar .sep{width:1px;background:var(--bd);margin:0 4px}
.help-block{background:var(--btn);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--mid);margin-bottom:10px}
.help-block code{background:var(--card);padding:2px 6px;border-radius:4px;font-family:monospace;color:var(--acc);font-size:.92em}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.emoji-grid button{background:var(--btn);border:none;border-radius:8px;padding:10px 6px;font-size:22px;cursor:pointer;line-height:1}
.emoji-grid button:hover{background:var(--btn-h)}
.emoji-grid button.sel{background:var(--acc);box-shadow:0 0 0 2px var(--acc)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="es"><span class="sp"></span>Загрузка...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>

<script>
// ============================================================
// КОНФИГ
// ============================================================
const SB_URL = 'https://goxunwrvqrppfukbyzvb.supabase.co';
const SB_KEY = 'sb_publishable_WVJeW5Bbxi3s2NsV0MOxlQ_zBxav3-2';
const sb = supabase.createClient(SB_URL, SB_KEY);

const S = {
  screen:'menu', theme:localStorage.getItem('k_theme')||'dark',
  blocks:[], curBlock:null, curTopic:null,
  schedule:[], routine:[], session:null,
  readTopics:JSON.parse(localStorage.getItem('k_read')||'{}'),
  notes:JSON.parse(localStorage.getItem('k_notes')||'{}'),
  cards:[], ci:0, cs:false,
};
function saveLS(){
  localStorage.setItem('k_theme',S.theme);
  localStorage.setItem('k_read',JSON.stringify(S.readTopics));
  localStorage.setItem('k_notes',JSON.stringify(S.notes));
}
function eh(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function applyTheme(){document.body.classList.toggle('light',S.theme==='light');}
function toggleTheme(){S.theme=S.theme==='light'?'dark':'light';applyTheme();saveLS();render();}
const app=document.getElementById('app');
function showModal(h){closeModal();const o=document.createElement('div');o.className='mo';o.id='mo';o.onclick=e=>{if(e.target===o)closeModal();};o.innerHTML=`<div class="md">${h}</div>`;document.body.appendChild(o);}
function closeModal(){const o=document.getElementById('mo');if(o)o.remove();}

// ============================================================
// MARKDOWN-РЕНДЕР
// ============================================================
function renderMd(text){
  if(!text) return '<div class="es" style="padding:20px"><span class="be">✍️</span>Пока пусто</div>';
  const lines = text.replace(/\r\n/g,'\n').split('\n');
  let h = '';
  let inUl = false;
  const closeUl = () => { if(inUl){h+='</ul>';inUl=false;} };
  for(let i=0;i<lines.length;i++){
    let l = lines[i];
    // Экранируем
    l = eh(l);
    // Inline: **жирный** *курсив* `код`
    const inline = (s) => s
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/`(.+?)`/g,'<code>$1</code>');
    if(l.startsWith('### ')){ closeUl(); h += `<h4>${inline(l.slice(4))}</h4>`; }
    else if(l.startsWith('## ')){ closeUl(); h += `<h3>${inline(l.slice(3))}</h3>`; }
    else if(l.startsWith('# ')){ closeUl(); h += `<h3 style="font-size:1.15em">${inline(l.slice(2))}</h3>`; }
    else if(l.startsWith('> ')){ closeUl(); h += `<blockquote>${inline(l.slice(2))}</blockquote>`; }
    else if(l.startsWith('- ')||l.startsWith('• ')){ if(!inUl){h+='<ul>';inUl=true;} h += `<li>${inline(l.slice(2))}</li>`; }
    else if(l.trim()==='---'){ closeUl(); h += '<hr>'; }
    else if(l.trim()===''){ closeUl(); }
    else { closeUl(); h += `<p>${inline(l)}</p>`; }
  }
  closeUl();
  return h;
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
async function init(){
  applyTheme();
  const {data} = await sb.auth.getSession();
  S.session = data?.session || null;
  const {data:st} = await sb.from('settings').select('*');
  (st||[]).forEach(s=>{
    if(s.key==='schedule') S.schedule = s.value||[];
    if(s.key==='routine') S.routine = s.value||[];
  });
  render();
}

async function loadBlocks(){
  const {data} = await sb.from('blocks').select('*').order('order_index').order('created_at');
  S.blocks = data||[];
  return S.blocks;
}
async function loadTopics(blockId){
  const {data} = await sb.from('topics').select('*').eq('block_id',blockId).order('order_index').order('created_at');
  return data||[];
}

// ============================================================
// ГЛАВНОЕ МЕНЮ
// ============================================================
async function render(){ if(S.screen==='menu') return renderMenu(); }
async function renderMenu(){
  S.screen='menu';
  app.innerHTML=`<div class="es"><span class="sp"></span>Загрузка...</div>`;
  await loadBlocks();
  const isAdmin = !!S.session;
  let h = `<div class="mh">
    <h1>📖 Конспект</h1>
    <div class="hr">
      <button class="ic" onclick="renderSearch()" title="Поиск">🔍</button>
      <button class="ic" onclick="renderSchedule()" title="Расписание">📅</button>
      <button class="ic" onclick="toggleTheme()">${S.theme==='light'?'🌙':'☀️'}</button>
      <button class="ic ${isAdmin?'active':''}" onclick="toggleAdmin()" title="Админ">${isAdmin?'🔓':'🔒'}</button>
    </div>
  </div>`;
  if(isAdmin){
    h += `<div class="c" style="border:2px solid var(--acc)">
      <div class="m" style="color:var(--acc);font-weight:600;margin-bottom:8px">⚙️ Режим редактирования</div>
      <button class="b" onclick="openBlockEditor(null)">+ Новый раздел</button>
      <button class="b" onclick="openScheduleEditor()">📅 Расписание недели</button>
      <button class="b" onclick="openRoutineEditor()">⏰ Распорядок дня</button>
    </div>`;
  }
  if(!S.blocks.length){
    h += `<div class="es"><span class="be">📭</span>Пока нет ни одного раздела.${isAdmin?'<br><br><button class="b pr" onclick="openBlockEditor(null)">+ Создать раздел</button>':'<br>Скоро появится.'}</div>`;
  } else {
    S.blocks.forEach(b=>{
      h += `<div class="ic2 cl" onclick="openBlock('${b.id}')">
        <div class="it">${b.icon||'📘'} ${eh(b.name)}</div>
        ${b.description?`<div class="is">${eh(b.description)}</div>`:''}
      </div>`;
    });
  }
  app.innerHTML = h;
}

async function openBlock(blockId){
  S.curBlock = S.blocks.find(b=>b.id===blockId);
  S.screen='block';
  const topics = await loadTopics(blockId);
  const isAdmin = !!S.session;
  let h = `<div class="tb"><button class="bb" onclick="renderMenu()">←</button><div class="t">${eh(S.curBlock.name)}</div></div>
    <h1>${S.curBlock.icon||'📘'} ${eh(S.curBlock.name)}</h1>`;
  if(isAdmin) h += `<div class="c"><button class="b pr" onclick="openTopicEditor(null)">+ Новая тема</button></div>`;
  if(!topics.length){
    h += `<div class="es"><span class="be">🚧</span>В этом разделе пока пусто.</div>`;
  } else {
    topics.forEach(t=>{
      const read = S.readTopics[t.id];
      h += `<div class="ic2 cl" onclick="openTopic('${t.id}')">
        <div class="it">${read?'<span style="color:var(--ok)">✅</span> ':''}${eh(t.title)}</div>
        ${t.subtitle?`<div class="is">${eh(t.subtitle)}</div>`:''}
        ${isAdmin?`<div class="r" style="margin-top:8px">
          <button class="b sm" onclick="event.stopPropagation();openTopicEditor('${t.id}')">✏️ Название</button>
          <button class="b sm dg" onclick="event.stopPropagation();deleteTopic('${t.id}')">🗑 Удалить</button>
        </div>`:''}
      </div>`;
    });
  }
  if(isAdmin) h += `<div class="c">
    <button class="b" onclick="openBlockEditor('${S.curBlock.id}')">✏️ Изменить раздел</button>
    <button class="b dg" onclick="deleteBlock('${S.curBlock.id}')">🗑 Удалить раздел</button>
  </div>`;
  app.innerHTML = h;
}

async function openTopic(topicId){
  const {data:t} = await sb.from('topics').select('*').eq('id',topicId).single();
  if(!t) return;
  S.curTopic = t;
  S.screen='topic';
  S.readTopics[topicId]=true; saveLS();
  const isAdmin = !!S.session;
  let h = `<div class="tb"><button class="bb" onclick="openBlock('${t.block_id}')">←</button><div class="t">${eh(t.title)}</div></div>
    <h1>${eh(t.title)}</h1>
    ${t.subtitle?`<div class="m" style="font-size:14px;margin-bottom:12px">${eh(t.subtitle)}</div>`:''}`;

  h += `<div class="c"><div class="tc">${renderMd(t.body||'')}</div></div>`;

  h += `<div class="c" id="notes">
    <div class="m">📝 Мои заметки</div>
    <textarea class="ta" id="naField" placeholder="Мои мысли по теме...">${eh(S.notes[topicId]||'')}</textarea>
    <button class="b pr" onclick="saveNote('${topicId}')">💾 Сохранить</button>
  </div>`;

  if(isAdmin){
    h += `<div class="c" style="border:2px solid var(--acc)">
      <div class="m" style="color:var(--acc);font-weight:600;margin-bottom:8px">⚙️ Редактирование темы</div>
      <button class="b pr" onclick="openTopicBodyEditor()">✏️ Редактировать конспект</button>
      <button class="b" onclick="openTopicEditor('${t.id}')">📝 Название и подзаголовок</button>
      <button class="b" onclick="openBlock('${t.block_id}')">← К списку тем</button>
    </div>`;
  }
  h += `<div class="c"><button class="b bk" onclick="renderMenu()">← Главное меню</button></div>`;
  app.innerHTML = h;
  window.scrollTo(0,0);
}

function saveNote(id){S.notes[id]=document.getElementById('naField').value;saveLS();alert('Заметка сохранена ✅');}

// ============================================================
// РЕДАКТОР КОНСПЕКТА (главное)
// ============================================================
function openTopicBodyEditor(){
  const t = S.curTopic;
  showModal(`<h3>✏️ Редактор конспекта</h3>
    <div class="help-block">
      <b>Как писать:</b><br>
      <code># Заголовок</code> — большой<br>
      <code>## Подзаголовок</code> — поменьше<br>
      <code>**жирный**</code>, <code>*курсив*</code>, <code>\`код\`</code><br>
      <code>- пункт</code> — список<br>
      <code>> важное</code> — выделенный блок<br>
      <code>---</code> — линия<br>
      Пустая строка — новый абзац.
    </div>
    <div class="editor-toolbar">
      <button onclick="insertMd('# ')">H1</button>
      <button onclick="insertMd('## ')">H2</button>
      <button onclick="insertMd('### ')">H3</button>
      <button onclick="insertMd('**','**')">Жирный</button>
      <button onclick="insertMd('*','*')">Курсив</button>
      <button onclick="insertMd('> ')">Важное</button>
      <button onclick="insertMd('- ')">Список</button>
      <button onclick="insertMd('---\\n')">Линия</button>
    </div>
    <button class="b" onclick="importDocx()">📥 Импорт из Word (docx)</button>
    <input type="file" id="docxFile" accept=".docx" style="display:none" onchange="onDocxPicked(this)">
    <textarea class="ta" id="bodyField" style="min-height:300px;font-family:monospace;font-size:14px" placeholder="Начни писать конспект...">${eh(t.body||'')}</textarea>
    <div class="ma">
      <button class="b" onclick="closeModal()">Отмена</button>
      <button class="b pr" onclick="saveTopicBody()">💾 Сохранить</button>
    </div>`);
}

function insertMd(before, after){
  const f = document.getElementById('bodyField');
  if(!f) return;
  const start = f.selectionStart;
  const end = f.selectionEnd;
  const txt = f.value;
  const sel = txt.slice(start,end);
  const beforeTxt = before || '';
  const afterTxt = after || '';
  f.value = txt.slice(0,start) + beforeTxt + sel + afterTxt + txt.slice(end);
  f.focus();
  const pos = start + beforeTxt.length + sel.length + afterTxt.length;
  f.setSelectionRange(pos,pos);
}

function onDocxPicked(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try {
      const result = await mammoth.convertToHtml({arrayBuffer:e.target.result});
      // Конвертируем HTML в нашу разметку
      let html = result.value;
      let md = html
        .replace(/<h1[^>]*>(.*?)<\/h1>/gi,'\n# $1\n')
        .replace(/<h2[^>]*>(.*?)<\/h2>/gi,'\n## $1\n')
        .replace(/<h3[^>]*>(.*?)<\/h3>/gi,'\n### $1\n')
        .replace(/<h4[^>]*>(.*?)<\/h4>/gi,'\n### $1\n')
        .replace(/<strong[^>]*>(.*?)<\/strong>/gi,'**$1**')
        .replace(/<b[^>]*>(.*?)<\/b>/gi,'**$1**')
        .replace(/<em[^>]*>(.*?)<\/em>/gi,'*$1*')
        .replace(/<i[^>]*>(.*?)<\/i>/gi,'*$1*')
        .replace(/<li[^>]*>(.*?)<\/li>/gi,'- $1\n')
        .replace(/<\/?ul[^>]*>/gi,'\n')
        .replace(/<\/?ol[^>]*>/gi,'\n')
        .replace(/<p[^>]*>(.*?)<\/p>/gi,'\n$1\n')
        .replace(/<br\s*\/?>/gi,'\n')
        .replace(/<[^>]+>/g,'')
        .replace(/&nbsp;/g,' ')
        .replace(/&amp;/g,'&')
        .replace(/&lt;/g,'<')
        .replace(/&gt;/g,'>')
        .replace(/\n\n\n+/g,'\n\n')
        .trim();
      const f = document.getElementById('bodyField');
      if(f.value.trim()){
        if(!confirm('В поле уже есть текст. Заменить его импортированным?')) return;
      }
      f.value = md;
      alert('✅ Импорт завершён. Проверь и сохрани.');
    } catch(err){
      alert('Не удалось импортировать: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderSchedule(){
  S.screen='schedule';
  const today = new Date().getDay();
  let h = `<div class="tb"><button class="bb" onclick="renderMenu()">←</button><div class="t">Расписание</div></div><h1>📅 Расписание</h1>`;
  if(!S.schedule.length){
    h += `<div class="es"><span class="be">📅</span>Расписание пока не заполнено.</div>`;
  } else {
    S.schedule.forEach(d=>{
      const isToday = d.dayIdx===today;
      h += `<div class="sd ${isToday?'td':''}">
        <div class="sdh"><div class="sdt">${eh(d.title)}</div>
          <div class="sdd">${eh(d.date||'')}${isToday?' <span class="bdg td">СЕГОДНЯ</span>':''}</div></div>
        ${(d.lessons||[]).length?d.lessons.map(l=>`<div class="sl"><div class="st">${eh(l.time)}</div><div class="ss2">${eh(l.subj)}</div></div>`).join(''):'<div class="se">Выходной</div>'}
      </div>`;
    });
  }
  if(S.routine.length){
    h += `<div class="c"><h2>⏰ Распорядок дня</h2>${S.routine.map(r=>`<div class="rr"><div class="rt">${eh(r.time)}</div><div class="rw">${eh(r.what)}</div></div>`).join('')}</div>`;
  }
  h += `<div class="c"><button class="b bk" onclick="renderMenu()">← Главное меню</button></div>`;
  app.innerHTML = h;
}

function openScheduleEditor(){
  const names=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const full=[];
  for(let i=1;i<=6;i++){
    const ex = S.schedule.find(d=>d.dayIdx===i);
    full.push(ex?JSON.parse(JSON.stringify(ex)):{dayIdx:i,title:names[i],date:'',lessons:[]});
  }
  const sun = S.schedule.find(d=>d.dayIdx===0);
  full.push(sun?JSON.parse(JSON.stringify(sun)):{dayIdx:0,title:names[0],date:'',lessons:[]});
  window.__sched = full;
  showModal(`<h3>📅 Расписание недели</h3>
    <div class="ib">Вводи пары на каждый день. Пустые дни станут выходными.</div>
    <div id="schedC"></div>
    <div class="ma">
      <button class="b" onclick="closeModal()">Отмена</button>
      <button class="b pr" onclick="saveSchedule()">💾 Сохранить</button>
    </div>`);
  renderSchedForm();
}

function renderSchedForm(){
  const c = document.getElementById('schedC');
  if(!c) return;
  let h='';
  window.__sched.forEach((d,di)=>{
    h += `<div style="background:var(--btn);padding:10px;border-radius:10px;margin-bottom:10px">
      <input class="in" style="margin:0 0 4px 0;font-weight:700;background:var(--card)" value="${eh(d.title)}" oninput="uS(${di},'title',this.value)" placeholder="День">
      <input class="in" style="margin:0 0 8px 0;font-size:13px;background:var(--card)" value="${eh(d.date)}" oninput="uS(${di},'date',this.value)" placeholder="13.10.26">`;
    (d.lessons||[]).forEach((l,li)=>{
      h += `<div style="display:flex;gap:4px;margin-bottom:4px">
        <input class="in" style="margin:0;width:110px;font-size:13px;background:var(--card)" value="${eh(l.time)}" oninput="uL(${di},${li},'time',this.value)" placeholder="09:30-11:00">
        <input class="in" style="margin:0;flex:1;font-size:13px;background:var(--card)" value="${eh(l.subj)}" oninput="uL(${di},${li},'subj',this.value)" placeholder="Предмет">
        <button class="b sm dg" style="width:36px;min-width:36px;padding:0;text-align:center" onclick="rL(${di},${li})">✕</button>
      </div>`;
    });
    h += `<button class="b sm" style="text-align:center;background:var(--card)" onclick="aL(${di})">+ Пара</button>
      <button class="b sm dg" style="text-align:center;margin-top:4px" onclick="cD(${di})">🗑 Очистить</button>
    </div>`;
  });
  c.innerHTML = h;
}
function uS(di,k,v){window.__sched[di][k]=v;}
function uL(di,li,k,v){window.__sched[di].lessons[li][k]=v;}
function aL(di){if(!window.__sched[di].lessons)window.__sched[di].lessons=[];window.__sched[di].lessons.push({time:'',subj:''});renderSchedForm();}
function rL(di,li){window.__sched[di].lessons.splice(li,1);renderSchedForm();}
function cD(di){if(!confirm('Очистить все пары этого дня?'))return;window.__sched[di].lessons=[];renderSchedForm();}
async function saveSchedule(){
  const clean = window.__sched.map(d=>({dayIdx:d.dayIdx,title:d.title,date:d.date,lessons:(d.lessons||[]).filter(l=>(l.subj||'').trim())}));
  const r = await sb.from('settings').upsert({key:'schedule',value:clean,updated_at:new Date().toISOString()});
  if(r.error){alert('Ошибка: '+r.error.message);return;}
  S.schedule = clean;
  closeModal();
  renderMenu();
}

function renderRoutineForm(){

function uR(i,k,v){window.__routine[i][k]=v;}
function addR(){window.__routine.push({time:'',what:''});renderRoutineForm();}
function rmR(i){window.__routine.splice(i,1);renderRoutineForm();}
async function saveRoutine(){
  const clean = window.__routine.filter(r=>(r.what||'').trim());
  const r = await sb.from('settings').upsert({key:'routine',value:clean,updated_at:new Date().toISOString()});

  S.routine = clean;
  closeModal();
  renderMenu();
}

function renderSearch(){
  S.screen='search';
  app.innerHTML = `<div class="tb"><button class="bb" onclick="renderMenu()">←</button><div class="t">Поиск</div></div><h1>🔍 Поиск</h1>
    <div class="c"><input class="in" id="sq" placeholder="Введи слово..." oninput="doSearch(this.value)"><div id="sr"></div></div>`;
  document.getElementById('sq').focus();
  doSearch('');
}
async function doSearch(q){
  const r = document.getElementById('sr');
  if(!r) return;
  q = (q||'').trim().toLowerCase();
  if(q.length<2){r.innerHTML=`<div class="es"><span class="be">🔎</span>Минимум 2 буквы</div>`;return;}
  const {data:topics} = await sb.from('topics').select('*');
  const results = [];
  (topics||[]).forEach(t=>{
    const hay = ((t.title||'')+' '+(t.subtitle||'')+' '+(t.body||'')).toLowerCase();
    if(hay.includes(q)){
      const idx = hay.indexOf(q);
      const snip = hay.slice(Math.max(0,idx-40),idx+80);
      results.push({id:t.id,title:t.title,snip});
    }
  });
  if(!results.length){r.innerHTML=`<div class="es">😕 Ничего не найдено</div>`;return;}
  r.innerHTML = `<div class="m">Найдено: ${results.length}</div>` + results.slice(0,30).map(x=>`<div class="ic2 cl" onclick="openTopic('${x.id}')"><div class="it">${eh(x.title)}</div><div class="is">…${eh(x.snip)}…</div></div>`).join('');
}

// ЭМОДЗИ
const EMOJIS = ['📘','📗','📕','📙','📔','📓','📒','📚','🎯','🔫','⚖️','🛡️','🚔','💊','🩺','🚨','🔥','⚠️','📋','🗂️','🏛️','👮','🎓','💼'];

function openBlockEditor(blockId){
  const b = blockId?S.blocks.find(x=>x.id===blockId):null;
  let curIcon = b?.icon || '📘';
  showModal(`<h3>${blockId?'Изменить':'Новый'} раздел</h3>
    <label class="lbl">Название</label>
    <input class="in" id="bn" value="${eh(b?.name||'')}" placeholder="Правовая подготовка">
    <label class="lbl">Иконка</label>
    <div class="emoji-grid" id="eg">${EMOJIS.map(e=>`<button type="button" class="${e===curIcon?'sel':''}" onclick="pickEmoji(this,'${e}')">${e}</button>`).join('')}</div>
    <label class="lbl">Или своя (эмодзи/символ)</label>
    <input class="in" id="bi" value="${eh(curIcon)}" maxlength="4">
    <label class="lbl">Описание</label>
    <input class="in" id="bd" value="${eh(b?.description||'')}">
    <label class="lbl">Порядок (число, меньше — выше)</label>
    <input class="in" id="bo" type="number" value="${b?.order_index||0}">
    <div class="ma"><button class="b" onclick="closeModal()">Отмена</button><button class="b pr" onclick="saveBlock('${blockId||''}')">Сохранить</button></div>`);
  window.__pickedEmoji = curIcon;
}
function pickEmoji(btn, emoji){
  document.querySelectorAll('#eg button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  window.__pickedEmoji = emoji;
  document.getElementById('bi').value = emoji;
}

async function saveBlock(id){
  const name = document.getElementById('bn').value.trim();
  let icon = document.getElementById('bi').value.trim();
  if(!icon) icon = window.__pickedEmoji || '📘';
  const description = document.getElementById('bd').value.trim();
  const order_index = parseInt(document.getElementById('bo').value)||0;
  if(!name){alert('Название обязательно');return;}
  const p = {name,icon,description,order_index};
  const r = id?await sb.from('blocks').update(p).eq('id',id):await sb.from('blocks').insert(p);
  if(r.error){alert('Ошибка: '+r.error.message);return;}
  closeModal();
  if(S.curBlock && id===S.curBlock.id){S.curBlock={...S.curBlock,...p};openBlock(S.curBlock.id);}
  else renderMenu();
}
async function deleteBlock(id){
  if(!confirm('Удалить раздел со всеми темами? Необратимо.'))return;
  await sb.from('blocks').delete().eq('id',id);
  S.curBlock=null;
  renderMenu();
}

async function openTopicEditor(topicId){
  let t = null;
  if(topicId){
    const {data} = await sb.from('topics').select('*').eq('id',topicId).single();
    t = data;
  }
  showModal(`<h3>${topicId?'Изменить':'Новая'} тема</h3>
    <label class="lbl">Название</label>
    <input class="in" id="tt" value="${eh(t?.title||'')}" placeholder="Например: Задержание">
    <label class="lbl">Подзаголовок (необязательно)</label>
    <input class="in" id="ts" value="${eh(t?.subtitle||'')}">
    <label class="lbl">Порядок (число)</label>
    <input class="in" id="to" type="number" value="${t?.order_index||0}">
    <div class="ma"><button class="b" onclick="closeModal()">Отмена</button><button class="b pr" onclick="saveTopic('${topicId||''}')">Сохранить</button></div>`);
}
async function saveTopic(id){
  const title = document.getElementById('tt').value.trim();
  const subtitle = document.getElementById('ts').value.trim();
  const order_index = parseInt(document.getElementById('to').value)||0;
  if(!title){alert('Название обязательно');return;}
  const p = {block_id:S.curBlock.id,title,subtitle,order_index};
  const r = id?await sb.from('topics').update(p).eq('id',id):await sb.from('topics').insert(p);
  if(r.error){alert('Ошибка: '+r.error.message);return;}
  closeModal();
  openBlock(S.curBlock.id);
}
async function deleteTopic(id){
  if(!confirm('Удалить тему?'))return;
  await sb.from('topics').delete().eq('id',id);
  if(S.curTopic && S.curTopic.id===id) S.curTopic=null;
  openBlock(S.curBlock.id);
}
