    }
  ],
  special: [],
  fire: [],
  tsp: [],
  med: [],
  tactics: []
};

// ============ ХРАНИЛИЩЕ ============
const K = {
  theme: 'konsp_theme',
  read: 'konsp_read',           // { topicId: true }
  fav: 'konsp_fav',             // [topicId, ...]
  notes: 'konsp_notes',         // { topicId: "текст" }
  checklist: 'konsp_checklist', // { "topicId:idx": true }
  questions: 'konsp_questions', // { topicId: [{text, date}] }
  compactMode: 'konsp_compact'
};

function loadJSON(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } }
function storageAvailable() { try { localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); return true; } catch(e) { return false; } }

let state = {
  screen: 'menu',
  subject: null,
  topicId: null,
  flashcards: [],    // для режима карточек
  fcIndex: 0,
  fcShown: false,
  theme: loadJSON(K.theme, 'dark'),
  read: loadJSON(K.read, {}),
  fav: loadJSON(K.fav, []),
  notes: loadJSON(K.notes, {}),
  checklist: loadJSON(K.checklist, {}),
  questions: loadJSON(K.questions, {}),
  compactMode: loadJSON(K.compactMode, false)
};

function saveRead() { saveJSON(K.read, state.read); }
function saveFav() { saveJSON(K.fav, state.fav); }
function saveNotes() { saveJSON(K.notes, state.notes); }
function saveChecklist() { saveJSON(K.checklist, state.checklist); }
function saveQuestions() { saveJSON(K.questions, state.questions); }
function saveCompact() { saveJSON(K.compactMode, state.compactMode); }
function saveTheme() { saveJSON(K.theme, state.theme); }

function applyTheme() { document.body.classList.toggle('light', state.theme === 'light'); }
function toggleTheme() { state.theme = state.theme === 'light' ? 'dark' : 'light'; saveTheme(); applyTheme(); if (state.screen === 'menu') renderMenu(); }
function toggleCompact() { state.compactMode = !state.compactMode; saveCompact(); renderTopic(state.topicId); }

// ============ ДОСТУП К ДАННЫМ ============
function getAllTopics() {
  const arr = [];
  SUBJECTS.forEach(s => {
    (TOPICS[s.id] || []).forEach(t => arr.push({ ...t, subject: s.id, subjectTitle: s.title }));
  });
  return arr;
}
function findTopic(id) { return getAllTopics().find(t => t.id === id); }
function countTopicsBySubject(sid) { return (TOPICS[sid] || []).length; }
function countReadBySubject(sid) { return (TOPICS[sid] || []).filter(t => state.read[t.id]).length; }

// ============ РЕНДЕР: МЕНЮ ============
const app = document.getElementById('app');
function renderMenu() {
  state.screen = 'menu';
  const themeIcon = state.theme === 'light' ? '🌙' : '☀️';
  let html = `<div class="menu-header"><h1>Гвардейский конспект</h1><button class="theme-btn" onclick="toggleTheme()">${themeIcon}</button></div>`;
  if (!storageAvailable()) html += `<div class="warn-box">⚠️ Браузер не сохраняет прогресс.</div>`;

  html += `<div class="quick-row">
    <button class="btn" onclick="renderSearch()"><span class="icon">🔍</span>Поиск по конспектам</button>
    <button class="btn" onclick="renderRandom()"><span class="icon">🎲</span>Случайная тема</button>
  </div>`;

  SUBJECTS.forEach(s => {
    const total = countTopicsBySubject(s.id);
    const read = countReadBySubject(s.id);
    const pct = total > 0 ? Math.round((read / total) * 100) : 0;
    const isEmpty = total === 0;
    html += `<div class="card">
      <div class="block-title"><h2>${s.icon} ${s.title}</h2><span class="counter">${total} ${total === 1 ? 'тема' : 'тем'}</span></div>
      ${isEmpty
        ? `<div class="meta">🚧 Материал появится позже</div><button class="btn primary" disabled>Скоро</button>`
        : `<div class="meta">📖 Прочитано: <b>${read}/${total}</b> (${pct}%)</div><div class="learned-bar"><div style="width:${pct}%"></div></div>
           <button class="btn section ${s.cls}" onclick="renderSubject('${s.id}')" style="margin-top:10px">Открыть</button>`}
    </div>`;
  });

  html += `<div class="contact-card">
    <div class="contact-title">Нашли ошибку? Есть конспект?</div>
    <div class="contact-text">Пишите — добавим в общий доступ, будем готовиться вместе.</div>
    <a class="contact-link" href="https://wa.me/79779436119" target="_blank" rel="noopener">
      <span class="wa-icon">💬</span>
      <div>
        <div class="contact-name">Гений, лентяй, красавчик, гвардеец</div>
        <div class="contact-sub">Автор этого безобразия</div>
        <div class="contact-phone">+7 977 943-61-19 · WhatsApp</div>
      </div>
    </a>
  </div>`;
  app.innerHTML = html; window.scrollTo(0, 0);
}

// ============ РЕНДЕР: ПРЕДМЕТ ============
function renderSubject(sid) {
  state.screen = 'subject';
  state.subject = sid;
  const s = SUBJECTS.find(x => x.id === sid);
  const topics = TOPICS[sid] || [];
  let html = `<div class="topbar"><button class="back-btn" onclick="renderMenu()">←</button><div class="title">${s.title}</div></div>
    <h1>${s.icon} ${s.title}</h1>
    <div class="section-sub">${topics.length} тем · прочитано ${countReadBySubject(sid)}</div>`;
  if (topics.length === 0) {
    html += `<div class="empty-state"><span class="big-emoji">🚧</span>Здесь пока пусто.<br>Темы появятся по мере написания конспектов.</div>`;
  } else {
    topics.forEach(t => {
      const isRead = state.read[t.id];
      const isFav = state.fav.includes(t.id);
      html += `<div class="item-card" onclick="renderTopic('${t.id}')">
        <div class="item-title">${isFav ? '⭐ ' : ''}${isRead ? '<span class="read-check">✅</span> ' : ''}${t.title}</div>
        <div class="item-sub">${t.subtitle || ''}</div>
      </div>`;
    });
  }
  html += `<div class="card"><button class="btn back" onclick="renderMenu()">← Главное меню</button></div>`;
  app.innerHTML = html; window.scrollTo(0, 0);
}

// ============ РЕНДЕР: ТЕМА ============
function renderTopic(id) {
  const t = findTopic(id);
  if (!t) { renderMenu(); return; }
  state.screen = 'topic';
  state.topicId = id;
  state.read[id] = true;
  saveRead();

  const isFav = state.fav.includes(id);
  const note = state.notes[id] || '';
  const questions = state.questions[id] || [];

  let html = `<div class="topbar">
    <button class="back-btn" onclick="renderSubject('${t.subject}')">←</button>
    <div class="title">${t.title}</div>
    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${id}')">${isFav ? '★' : '☆'}</button>
  </div>
  <h1>${t.title}</h1>
  <div class="section-sub">${t.subtitle || ''}</div>

  <div class="topic-actions">
    <button class="btn" onclick="toggleCompact()">${state.compactMode ? '📖 Полный текст' : '🎯 Только главное'}</button>
    <button class="btn" onclick="speakTopic('${id}')">🔊 Слушать</button>
    <button class="btn" onclick="startFlashcards('${id}')">🎴 Карточки (${countCards(t)})</button>
    <button class="btn" onclick="scrollToNotes()">📝 Мои заметки</button>
  </div>`;

  if (state.compactMode) html += `<div class="compact-note">🎯 Режим «Только главное» — показаны заголовки и ключевые тезисы.</div>`;

  html += `<div class="card"><div class="topic-content">${renderBlocks(t.blocks)}</div></div>`;

  if (t.links && t.links.length > 0) {
    html += `<div class="card">
      <div class="meta">🔗 Связанные темы</div>
      <div>${t.links.map(l => {
        const linked = findTopic(l.to);
        const disabled = !linked;
        return `<button class="link-chip" ${disabled ? 'disabled style="opacity:.5"' : `onclick="renderTopic('${l.to}')"`}>${disabled ? '🚧' : '→'} ${l.title}</button>`;
      }).join('')}</div>
    </div>`;
  }

  if (t.checklist && t.checklist.length > 0) {
    html += `<div class="card">
      <div class="block-title"><h2>☑️ Что надо знать</h2></div>
      <div class="section-sub">Отметь по мере усвоения</div>
      ${t.checklist.map((item, i) => {
        const key = id + ':' + i;
        const done = state.checklist[key];
        return `<div class="checklist-item ${done ? 'done' : ''}" onclick="toggleChecklist('${id}',${i})">
          <div class="checklist-box">✓</div>
          <div class="checklist-text">${item}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  html += `<div class="card" id="notesBlock">
    <div class="block-title"><h2>📝 Мои заметки</h2></div>
    <div class="section-sub">Пиши, что понял, что запомнить. Сохраняется на устройстве.</div>
    <textarea class="notes-area" id="notesField" placeholder="Мои мысли по теме...">${escapeHtml(note)}</textarea>
    <button class="btn primary" onclick="saveNote('${id}')" style="margin-top:8px">💾 Сохранить заметку</button>
  </div>`;

  html += `<div class="card">
    <div class="block-title"><h2>❓ Вопросы по теме</h2></div>
    <div class="section-sub">Не понял что-то? Оставь вопрос — на него ответят.</div>
    ${questions.length > 0 ? questions.map(q => `<div class="item-card" style="cursor:default"><div class="item-q">${escapeHtml(q.text)}</div><div class="item-sub" style="margin-top:4px">${q.date}</div></div>`).join('') : ''}
    <input type="text" class="search-input" id="questionField" placeholder="Напиши свой вопрос...">
    <button class="btn" onclick="addQuestion('${id}')">📨 Отправить вопрос</button>
  </div>`;

  html += `<div class="card"><button class="btn back" onclick="renderSubject('${t.subject}')">← К списку тем</button><button class="btn back" onclick="renderMenu()">← Главное меню</button></div>`;

  app.innerHTML = html; window.scrollTo(0, 0);
}

function countCards(t) { return (t.blocks || []).filter(b => b.type === 'card').length; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderBlocks(blocks) {
  let html = '';
  (blocks || []).forEach(b => {
    if (state.compactMode && b.type !== 'h3' && b.type !== 'key') return;
    if (b.type === 'h3') html += `<h3>${b.text}</h3>`;
    else if (b.type === 'p') html += `<p>${b.text}</p>`;
    else if (b.type === 'key') html += `<div class="key-block">🔑 ${b.text}</div>`;
    else if (b.type === 'term') html += `<div class="term-block"><b>${b.term}</b><br>${b.def}</div>`;
    else if (b.type === 'ul') html += `<ul>${b.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
    else if (b.type === 'card') { /* карточки не рендерятся в тексте */ }
  });
  return html;
}

function toggleFav(id) {
  const i = state.fav.indexOf(id);
  if (i >= 0) state.fav.splice(i, 1); else state.fav.push(id);
  saveFav();
  renderTopic(id);
}
function toggleChecklist(tid, idx) {
  const key = tid + ':' + idx;
  if (state.checklist[key]) delete state.checklist[key]; else state.checklist[key] = true;
  saveChecklist();
  renderTopic(tid);
}
function saveNote(id) {
  const v = document.getElementById('notesField').value;
  state.notes[id] = v;
  saveNotes();
  alert('Заметка сохранена ✅');
}
function scrollToNotes() { const el = document.getElementById('notesBlock'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
function addQuestion(id) {
  const f = document.getElementById('questionField');
  const text = (f.value || '').trim();
  if (!text) return;
  if (!state.questions[id]) state.questions[id] = [];
  state.questions[id].push({ text, date: new Date().toLocaleString('ru-RU') });
  saveQuestions();
  renderTopic(id);
}

// ============ РЕЖИМ ФЛЕШ-КАРТОЧЕК ============
function startFlashcards(id) {
  const t = findTopic(id);
  if (!t) return;
  const cards = (t.blocks || []).filter(b => b.type === 'card').map(b => ({ q: b.q, a: b.a }));
  if (cards.length === 0) { alert('В этой теме нет карточек'); return; }
  state.flashcards = shuffle(cards);
  state.fcIndex = 0;
  state.fcShown = false;
  state.topicId = id;
  state.screen = 'flashcards';
  renderFlashcard();
}
function renderFlashcard() {
  if (state.fcIndex >= state.flashcards.length) { renderFlashcardsDone(); return; }
  const c = state.flashcards[state.fcIndex];
  const t = findTopic(state.topicId);
  app.innerHTML = `<div class="topbar">
    <button class="back-btn" onclick="renderTopic('${state.topicId}')">←</button>
    <div class="title">${t.title} · карточка ${state.fcIndex + 1} из ${state.flashcards.length}</div>
  </div>
  <div class="progress"><div style="width:${Math.round(state.fcIndex / state.flashcards.length * 100)}%"></div></div>
  <div class="flashcard" onclick="flipCard()">
    <div class="fc-question">${c.q}</div>
    ${state.fcShown ? `<div class="fc-answer"><b>💡 Ответ:</b><br>${c.a}</div>` : `<div class="fc-hint">👆 Нажми, чтобы увидеть ответ</div>`}
  </div>
  <div class="card">
    <button class="btn primary" onclick="nextCard()">${state.fcIndex + 1 >= state.flashcards.length ? 'Завершить' : 'Следующая →'}</button>
    <button class="btn back" onclick="renderTopic('${state.topicId}')">← Выйти</button>
  </div>`;
  window.scrollTo(0, 0);
}
function flipCard() { state.fcShown = !state.fcShown; renderFlashcard(); }
function nextCard() { state.fcIndex++; state.fcShown = false; renderFlashcard(); }
function renderFlashcardsDone() {
  app.innerHTML = `<div class="card center">
    <h2>🎴 Карточки пройдены</h2>
    <div class="big">${state.flashcards.length}</div>
    <div class="meta">карточек просмотрено</div>
  </div>
  <div class="card">
    <button class="btn primary" onclick="startFlashcards('${state.topicId}')">Пройти заново</button>
    <button class="btn" onclick="renderTopic('${state.topicId}')">← Вернуться к теме</button>
  </div>`;
  window.scrollTo(0, 0);
}

// ============ ПОИСК ============
function renderSearch() {
  state.screen = 'search';
  app.innerHTML = `<div class="topbar"><button class="back-btn" onclick="renderMenu()">←</button><div class="title">Поиск по конспектам</div></div>
    <h1>🔍 Поиск</h1>
    <input type="text" class="search-input" id="searchInput" placeholder="Введи слово, например: задержание" autocomplete="off">
    <div id="searchResults"></div>`;
  const inp = document.getElementById('searchInput');
  inp.addEventListener('input', () => doSearch(inp.value));
  inp.focus();
  doSearch('');
}
function doSearch(q) {
  const box = document.getElementById('searchResults');
  if (!box) return;
  const query = (q || '').trim().toLowerCase();
  if (query.length < 2) {
    box.innerHTML = `<div class="empty-state"><span class="big-emoji">🔎</span>Введи минимум 2 буквы</div>`;
    return;
  }
  const results = [];
  getAllTopics().forEach(t => {
    (t.blocks || []).forEach(b => {
      let hay = '';
      if (b.type === 'h3' || b.type === 'p' || b.type === 'key') hay = b.text;
      else if (b.type === 'term') hay = b.term + ' ' + b.def;
      else if (b.type === 'ul') hay = b.items.join(' ');
      else if (b.type === 'card') hay = b.q + ' ' + b.a;
      if (hay && hay.toLowerCase().includes(query)) {
        const idx = hay.toLowerCase().indexOf(query);
        const snippet = hay.slice(Math.max(0, idx - 40), idx + 80);
        results.push({ topic: t, snippet: snippet.replace(new RegExp(query, 'gi'), m => `**${m}**`) });
      }
    });
  });
  if (results.length === 0) {
    box.innerHTML = `<div class="empty-state"><span class="big-emoji">😕</span>Ничего не найдено</div>`;
    return;
  }
  let html = `<div class="meta">Найдено: ${results.length} фрагментов</div>`;
  results.slice(0, 30).forEach(r => {
    html += `<div class="item-card" onclick="renderTopic('${r.topic.id}')">
      <div class="block-tag">${r.topic.subjectTitle}</div>
      <div class="item-title">${r.topic.title}</div>
      <div class="item-sub">...${r.snippet.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}...</div>
    </div>`;
  });
  box.innerHTML = html;
}

// ============ СЛУЧАЙНАЯ ТЕМА ============
function renderRandom() {
  const all = getAllTopics();
  if (all.length === 0) { alert('Пока нет ни одной темы'); return; }
  const t = all[Math.floor(Math.random() * all.length)];
  renderTopic(t.id);
}

// ============ TTS ============
function speakTopic(id) {
  const t = findTopic(id);
  if (!t) return;
  if (!('speechSynthesis' in window)) { alert('Синтез речи не поддерживается браузером'); return; }
  window.speechSynthesis.cancel();
  let text = t.title + '. ' + (t.subtitle || '') + '. ';
  (t.blocks || []).forEach(b => {
    if (b.type === 'h3') text += b.text + '. ';
    else if (b.type === 'p') text += b.text + ' ';
    else if (b.type === 'key') text += 'Важно: ' + b.text + ' ';
    else if (b.type === 'term') text += b.term + ': ' + b.def + ' ';
    else if (b.type === 'ul') text += b.items.join('. ') + '. ';
  });
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = 1;
  window.speechSynthesis.speak(u);
  alert('🔊 Чтение началось. Чтобы остановить — выйди из темы или обнови страницу.');
}

// ============ УТИЛИТЫ ============
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }

// ============ PWA ============
(function setupPWA() {
  try {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect fill="#0f172a" width="192" height="192" rx="36"/><text x="96" y="132" font-size="100" text-anchor="middle" fill="#facc15">📖</text></svg>';
    const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    const manifest = { name: 'Гвардейский конспект', short_name: 'Конспект', start_url: './', display: 'standalone', background_color: '#0f172a', theme_color: '#0f172a',
      icons: [{ src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' }, { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }] };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const url = URL.createObjectURL(blob);
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = url; document.head.appendChild(l);
    const ai = document.createElement('link'); ai.rel = 'apple-touch-icon'; ai.href = iconUrl; document.head.appendChild(ai);
  } catch (e) {}
})();

applyTheme();
renderMenu();
</script>
