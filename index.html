<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Конспект">
<title>Конспект</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  :root {
    --bg:#0f172a; --card:#1e293b; --btn:#334155; --btn-h:#475569;
    --text:#e2e8f0; --dim:#94a3b8; --mid:#cbd5e1; --bright:#f1f5f9;
    --acc:#2563eb; --acc-h:#1d4ed8; --bd:#475569;
    --ok:#16a34a; --warn:#dc2626;
    --key-bg:#1e3a8a; --key-bd:#3b82f6; --key-t:#dbeafe;
    --term-bg:#422006; --term-bd:#a16207; --term-t:#fde68a;
    --input:#0f172a; --input-bd:#475569;
    --danger:#dc2626;
  }
  body.light {
    --bg:#f1f5f9; --card:#fff; --btn:#e2e8f0; --btn-h:#cbd5e1;
    --text:#0f172a; --dim:#64748b; --mid:#475569; --bright:#0f172a;
    --acc:#2563eb; --acc-h:#1d4ed8; --bd:#cbd5e1;
    --key-bg:#dbeafe; --key-bd:#2563eb; --key-t:#1e3a8a;
    --term-bg:#fef3c7; --term-bd:#a16207; --term-t:#422006;
    --input:#fff; --input-bd:#cbd5e1;
  }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh; font-size:clamp(15px,4.2vw,17px); line-height:1.6; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); padding-bottom:env(safe-area-inset-bottom); transition:.2s; }
  .wrap { max-width:820px; margin:0 auto; padding:clamp(12px,3.5vw,18px); }
  h1 { font-size:clamp(20px,5.5vw,24px); margin:4px 0 16px; }
  h2 { font-size:clamp(17px,4.6vw,19px); margin:0 0 10px; }
  h3 { font-size:clamp(15.5px,4.2vw,17px); margin:18px 0 8px; color:var(--bright); padding-bottom:4px; border-bottom:1px solid var(--bd); }
  h3:first-child { margin-top:0; }
  .mh { display:flex; justify-content:space-between; align-items:center; margin:4px 0 16px; gap:10px; flex-wrap:wrap; }
  .mh h1 { margin:0; }
  .hr { display:flex; gap:8px; align-items:center; }
  .ic { background:var(--btn); border:none; border-radius:10px; font-size:18px; padding:8px 12px; cursor:pointer; color:var(--text); line-height:1; flex-shrink:0; }
  .ic.active { background:var(--acc); color:#fff; }
  .c { background:var(--card); border-radius:14px; padding:clamp(14px,4vw,20px); margin-bottom:12px; box-shadow:0 4px 14px rgba(0,0,0,.15); overflow-wrap:break-word; }
  .b { display:block; width:100%; padding:13px 16px; margin:8px 0; background:var(--btn); color:var(--text); border:none; border-radius:10px; font-size:clamp(14.5px,4vw,16px); line-height:1.4; text-align:left; cursor:pointer; transition:.15s; font-family:inherit; min-height:48px; overflow-wrap:break-word; }
  .b:hover { background:var(--btn-h); }
  .b.pr { background:var(--acc); text-align:center; font-weight:600; color:#fff; }
  .b.pr:hover { background:var(--acc-h); }
  .b.dg { background:var(--danger); text-align:center; color:#fff; }
  .b.bk { background:transparent; color:var(--dim); text-align:center; }
  .b.sm { min-height:34px; padding:6px 10px; font-size:clamp(12.5px,3.5vw,13.5px); margin:3px 0; }
  .b.cn { text-align:center; }
  .r { display:flex; gap:8px; flex-wrap:wrap; }
  .r .b { flex:1; text-align:center; min-width:80px; }
  .m { font-size:clamp(12px,3.4vw,13.5px); color:var(--dim); margin-bottom:8px; }
  .bdg { display:inline-block; padding:2px 7px; border-radius:5px; background:var(--btn); font-size:clamp(11px,3.1vw,12px); color:var(--mid); margin:2px 4px 2px 0; }
  .bdg.ok { background:#14532d; color:#bbf7d0; }
  .bdg.wr { background:#7c2d12; color:#fed7aa; }
  .bdg.td { background:#7c2d12; color:#fed7aa; font-weight:700; }
  .ctr { text-align:center; }
  .tb { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .tb .bb { background:var(--btn); color:var(--text); border:none; border-radius:10px; padding:8px 14px; font-size:18px; cursor:pointer; font-family:inherit; min-height:40px; min-width:44px; display:flex; align-items:center; justify-content:center; line-height:1; }
  .tb .t { flex:1; font-size:clamp(12px,3.4vw,14px); color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wb { background:#7c2d12; color:#fed7aa; padding:12px; border-radius:10px; font-size:14px; margin-bottom:12px; line-height:1.5; }
  .ib { background:var(--btn); color:var(--mid); padding:12px; border-radius:10px; font-size:13.5px; margin-bottom:12px; line-height:1.5; }
  .in { width:100%; padding:13px 15px; font-size:clamp(15px,4vw,16px); background:var(--input); border:1.5px solid var(--input-bd); color:var(--text); border-radius:10px; font-family:inherit; margin-bottom:10px; -webkit-appearance:none; }
  .in:focus { outline:none; border-color:var(--acc); }
  .ta { width:100%; min-height:80px; padding:13px 15px; font-size:clamp(14.5px,3.8vw,15.5px); background:var(--input); border:1.5px solid var(--input-bd); color:var(--text); border-radius:10px; font-family:inherit; margin-bottom:10px; line-height:1.5; resize:vertical; -webkit-appearance:none; }
  .ta:focus { outline:none; border-color:var(--acc); }
  .lbl { display:block; font-size:clamp(13px,3.6vw,14.5px); color:var(--mid); margin-bottom:6px; margin-top:8px; }
  .ic2 { background:var(--card); border-radius:12px; padding:14px; margin-bottom:8px; border:1px solid transparent; transition:.15s; }
  .ic2.cl { cursor:pointer; }
  .ic2.cl:hover { border-color:var(--bd); }
  .ic2 .it { font-size:clamp(15px,4.2vw,16.5px); font-weight:600; line-height:1.4; color:var(--bright); margin-bottom:4px; }
  .ic2 .is { font-size:clamp(12px,3.4vw,13.5px); color:var(--dim); line-height:1.4; }
  .es { text-align:center; padding:40px 20px; color:var(--dim); font-size:15px; }
  .es .be { font-size:48px; margin-bottom:12px; display:block; }
  .tc { font-size:clamp(14.5px,4vw,16px); line-height:1.65; color:var(--mid); }
  .tc p { margin:8px 0; }
  .kb { background:var(--key-bg); border-left:4px solid var(--key-bd); padding:12px 14px; border-radius:8px; margin:12px 0; color:var(--key-t); font-weight:500; }
  .tmb { background:var(--term-bg); border-left:4px solid var(--term-bd); padding:12px 14px; border-radius:8px; margin:12px 0; color:var(--term-t); }
  .tmb b { color:var(--bright); font-size:1.05em; }
  .tc ul { padding-left:22px; margin:8px 0; }
  .tc li { margin:4px 0; }
  .tc img { max-width:100%; border-radius:8px; margin:12px 0; display:block; }
  .imc { font-size:12.5px; color:var(--dim); font-style:italic; text-align:center; margin-top:-6px; margin-bottom:12px; }
  .tac { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .tac .b { margin:0; text-align:center; min-height:46px; font-size:clamp(12.5px,3.5vw,14px); padding:10px; }
  .ss { color:var(--dim); font-size:clamp(13px,3.6vw,14.5px); margin-bottom:12px; }
  .cli { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--bd); cursor:pointer; }
  .cli:last-child { border-bottom:none; }
  .clb { width:22px; height:22px; border:2px solid var(--bd); border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent; transition:.15s; margin-top:2px; }
  .cli.done .clb { background:var(--ok); border-color:var(--ok); color:#fff; }
  .cli.done .clt { color:var(--dim); text-decoration:line-through; }
  .fc { background:var(--card); border-radius:14px; padding:24px 20px; margin-bottom:14px; text-align:center; min-height:200px; display:flex; flex-direction:column; justify-content:center; cursor:pointer; }
  .fc .fq { font-size:clamp(15px,4.2vw,17px); color:var(--bright); font-weight:500; line-height:1.5; }
  .fc .fh { font-size:clamp(11.5px,3.2vw,13px); color:var(--dim); margin-top:14px; }
  .fc .fa { margin-top:16px; padding-top:16px; border-top:1px dashed var(--bd); color:var(--acc); font-size:clamp(14px,4vw,16px); line-height:1.55; text-align:left; }
  .na { width:100%; min-height:100px; background:var(--input); border:1.5px solid var(--input-bd); color:var(--text); border-radius:10px; padding:12px 14px; font-family:inherit; font-size:clamp(14px,3.8vw,15.5px); line-height:1.55; resize:vertical; }
  .na:focus { outline:none; border-color:var(--acc); }
  .cn { background:var(--bg); border-left:4px solid var(--acc); padding:10px 14px; border-radius:8px; font-size:clamp(12.5px,3.5vw,14px); color:var(--dim); margin-bottom:12px; }
  .mo { position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:flex-start; justify-content:center; padding:16px; z-index:1000; overflow-y:auto; }
  .md { background:var(--card); border-radius:14px; padding:20px; max-width:560px; width:100%; max-height:90vh; overflow-y:auto; margin:auto; }
  .md h3 { margin-top:0; border:none; padding:0; }
  .ma { display:flex; gap:8px; margin-top:12px; }
  .ma .b { flex:1; text-align:center; }
  .sp { display:inline-block; width:18px; height:18px; border:2px solid var(--bd); border-top-color:var(--acc); border-radius:50%; animation:sp .8s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .hd { display:none !important; }
  .sd { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:10px; border-left:4px solid var(--bd); }
  .sd.td { border-left-color:#ea580c; }
  .sdh { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
  .sdt { font-size:clamp(15px,4.2vw,16.5px); font-weight:700; color:var(--bright); }
  .sdd { font-size:clamp(11.5px,3.2vw,13px); color:var(--dim); }
  .sl { display:flex; gap:10px; padding:6px 0; font-size:clamp(13.5px,3.8vw,15px); line-height:1.45; border-bottom:1px dashed var(--bd); }
  .sl:last-child { border-bottom:none; }
  .st { min-width:96px; color:var(--dim); font-size:clamp(12px,3.4vw,13.5px); font-variant-numeric:tabular-nums; flex-shrink:0; }
  .ss2 { flex:1; color:var(--text); }
  .se { padding:6px 0; color:var(--dim); font-size:clamp(13px,3.6vw,14px); font-style:italic; }
  .rr { display:flex; gap:10px; padding:6px 0; border-bottom:1px dashed var(--bd); font-size:clamp(13.5px,3.8vw,15px); }
  .rr:last-child { border-bottom:none; }
  .rt { min-width:130px; color:var(--acc); font-weight:600; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .rw { flex:1; color:var(--text); }
  .ar { display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--bd); }
  .ar:last-child { border-bottom:none; }
  .arn { min-width:26px; color:var(--dim); font-size:13px; }
  .arb { flex:1; font-size:clamp(13px,3.6vw,14.5px); line-height:1.4; }
  .ara { display:flex; gap:4px; flex-shrink:0; }
  .ara button { background:var(--btn); border:none; border-radius:6px; padding:6px 9px; cursor:pointer; color:var(--text); font-size:13px; }
  .ara button:hover { background:var(--btn-h); }
  .ara button.dg { background:var(--danger); color:#fff; }
  .ctt { display:inline-block; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:600; margin-right:6px; vertical-align:middle; }
  .ct-h3{background:#6366f1;color:#fff} .ct-p{background:#64748b;color:#fff} .ct-key{background:#2563eb;color:#fff}
  .ct-term{background:#a16207;color:#fff} .ct-ul{background:#0891b2;color:#fff} .ct-card{background:#7c3aed;color:#fff} .ct-image{background:#16a34a;color:#fff}
  .sh { display:none; }
  .up-box { border:2px dashed var(--input-bd); border-radius:10px; padding:16px; text-align:center; cursor:pointer; }
  .up-box:hover { border-color:var(--acc); background:var(--btn); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="es"><span class="sp"></span>Загрузка...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// КОНФИГ
// ============================================================
const SB_URL = 'https://goxunwrvqrppfukbyzvb.supabase.co';
const SB_KEY = 'sb_publishable_WVJeW5Bbxi3s2NsV0MOxlQ_zBxav3-2';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const S = {
  screen: 'menu',
  theme: localStorage.getItem('k_theme') || 'dark',
  blocks: [],
  curBlock: null,
  curTopic: null,
  curBlockAdmin: null,
  curTopicAdmin: null,
  schedule: [],
  routine: [],
  session: null,
  compact: localStorage.getItem('k_compact') === '1',
  readTopics: JSON.parse(localStorage.getItem('k_read') || '{}'),
  notes: JSON.parse(localStorage.getItem('k_notes') || '{}'),
  checklist: JSON.parse(localStorage.getItem('k_cl') || '{}'),
  cards: [], ci: 0, cs: false,
};

function saveLS() {
  localStorage.setItem('k_theme', S.theme);
  localStorage.setItem('k_compact', S.compact ? '1' : '0');
  localStorage.setItem('k_read', JSON.stringify(S.readTopics));
  localStorage.setItem('k_notes', JSON.stringify(S.notes));
  localStorage.setItem('k_cl', JSON.stringify(S.checklist));
}
function eh(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function applyTheme() { document.body.classList.toggle('light', S.theme === 'light'); }
function toggleTheme() { S.theme = S.theme === 'light' ? 'dark' : 'light'; applyTheme(); saveLS(); render(); }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'; }

const app = document.getElementById('app');
function showModal(h) { closeModal(); const o = document.createElement('div'); o.className='mo'; o.id='mo'; o.onclick=e=>{if(e.target===o)closeModal();}; o.innerHTML=`<div class="md">${h}</div>`; document.body.appendChild(o); }
function closeModal() { const o = document.getElementById('mo'); if (o) o.remove(); }

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
async function init() {
  applyTheme();
  const { data } = await sb.auth.getSession();
  S.session = data?.session || null;
  const { data: settings } = await sb.from('settings').select('*');
  (settings || []).forEach(s => {
    if (s.key === 'schedule') S.schedule = s.value || [];
    if (s.key === 'routine') S.routine = s.value || [];
  });
  render();
}

async function loadBlocks() {
  const { data } = await sb.from('blocks').select('*').order('order_index').order('created_at');
  S.blocks = data || [];
  return S.blocks;
}
async function loadTopics(blockId) {
  const { data } = await sb.from('topics').select('*').eq('block_id', blockId).order('order_index').order('created_at');
  return data || [];
}
async function loadContent(topicId) {
  const { data } = await sb.from('content').select('*').eq('topic_id', topicId).order('order_index').order('created_at');
  return data || [];
}
async function loadChecklist(topicId) {
  const { data } = await sb.from('checklist').select('*').eq('topic_id', topicId).order('order_index');
  return data || [];
}

// ============================================================
// ГЛАВНОЕ МЕНЮ
// ============================================================
async function render() {
  if (S.screen === 'menu') return renderMenu();
  if (S.screen === 'topic') return renderTopic(S.curTopic.id);
}

async function renderMenu() {
  S.screen = 'menu';
  app.innerHTML = `<div class="es"><span class="sp"></span>Загрузка...</div>`;
  await loadBlocks();
  const isAdmin = !!S.session;
  let h = `
    <div class="mh">
      <h1>📖 Конспект</h1>
      <div class="hr">
        <button class="ic" onclick="renderSearch()" title="Поиск">🔍</button>
        <button class="ic" onclick="renderSchedule()" title="Расписание">📅</button>
        <button class="ic" onclick="toggleTheme()">${S.theme==='light'?'🌙':'☀️'}</button>
        <button class="ic ${isAdmin?'active':''}" onclick="toggleAdmin()">🔒</button>
      </div>
    </div>`;
  if (!S.blocks.length) {
    h += `<div class="es"><span class="be">📭</span>Пока нет ни одного раздела.${isAdmin?'<br><br><button class="b pr" onclick="openBlockEditor(null)">+ Создать раздел</button>':'<br>Скоро появится.'}</div>`;
  } else {
    S.blocks.forEach(b => {
      const topics = 0; // счётчик подгрузим ниже
      h += `<div class="ic2 cl" onclick="openBlock('${b.id}')">
        <div class="it">${b.icon || '📘'} ${eh(b.name)}</div>
        ${b.description ? `<div class="is">${eh(b.description)}</div>` : ''}
      </div>`;
    });
  }
  if (isAdmin) {
    h += `<div class="c" style="margin-top:14px"><div class="m">Режим редактирования включён</div>
      <button class="b" onclick="openScheduleEditor()">📅 Редактировать расписание</button>
      <button class="b" onclick="openRoutineEditor()">⏰ Редактировать распорядок дня</button>
      <button class="b" onclick="openBlockEditor(null)">+ Новый раздел</button>
    </div>`;
  }
  app.innerHTML = h;
}

async function openBlock(blockId) {
  S.curBlock = S.blocks.find(b => b.id === blockId);
  S.screen = 'block';
  const topics = await loadTopics(blockId);
  let h = `<div class="tb"><button class="bb" onclick="renderMenu()">←</button><div class="t">${eh(S.curBlock.name)}</div></div>
    <h1>${S.curBlock.icon||'📘'} ${eh(S.curBlock.name)}</h1>`;
  const isAdmin = !!S.session;
  if (isAdmin) h += `<div class="c"><button class="b pr" onclick="openTopicEditor(null)">+ Новая тема</button></div>`;
  if (!topics.length) {
    h += `<div class="es"><span class="be">🚧</span>В этом разделе пока пусто.</div>`;
  } else {
    topics.forEach(t => {
      const read = S.readTopics[t.id];
      h += `<div class="ic2 cl" onclick="openTopic('${t.id}')">
        <div class="it">${read?'<span style="color:var(--ok)">✅</span> ':''}${eh(t.title)}</div>
        ${t.subtitle?`<div class="is">${eh(t.subtitle)}</div>`:''}
        ${isAdmin?`<div class="r" style="margin-top:8px">
          <button class="b sm" onclick="event.stopPropagation();openTopicEditor('${t.id}')">✏️ Изменить</button>
          <button class="b sm dg" onclick="event.stopPropagation();deleteTopic('${t.id}')">🗑 Удалить</button>
        </div>`:''}
      </div>`;
    });
  }
  if (isAdmin) h += `<div class="c"><button class="b" onclick="openBlockEditor('${S.curBlock.id}')">✏️ Редактировать раздел</button>
    <button class="b dg" onclick="deleteBlock('${S.curBlock.id}')">🗑 Удалить раздел</button></div>`;
  app.innerHTML = h;
}

async function openTopic(topicId) {
  const { data: t } = await sb.from('topics').select('*').eq('id', topicId).single();
  if (!t) return;
  S.curTopic = t;
  S.screen = 'topic';
  S.readTopics[topicId] = true; saveLS();
  const [content, checklist] = await Promise.all([loadContent(topicId), loadChecklist(topicId)]);
  S.curContent = content;
  S.curChecklist = checklist;
  const isAdmin = !!S.session;
  const fav = false;
  let h = `<div class="tb"><button class="bb" onclick="openBlock('${t.block_id}')">←</button><div class="t">${eh(t.title)}</div></div>
    <h1>${eh(t.title)}</h1>
    ${t.subtitle?`<div class="ss">${eh(t.subtitle)}</div>`:''}
    <div class="tac">
      <button class="b" onclick="toggleCompact()">${S.compact?'📖 Полный текст':'🎯 Только главное'}</button>
      <button class="b" onclick="speak()">🔊 Слушать</button>
      <button class="b" onclick="startCards()">🎴 Карточки (${content.filter(c=>c.type==='card').length})</button>
      <button class="b" onclick="scrollNotes()">📝 Заметки</button>
    </div>
    ${S.compact?'<div class="cn">🎯 Режим «Только главное» — показаны заголовки и ключевые тезисы.</div>':''}
    <div class="c"><div class="tc">${renderContent(content)}</div></div>`;

  if (isAdmin) {
    h += `<div class="c"><div class="m">Админ-режим темы</div>
      <button class="b pr" onclick="openContentEditor(null)">+ Добавить блок</button>
      <button class="b" onclick="openTopicEditor('${t.id}')">✏️ Редактировать заголовок</button>
      <button class="b" onclick="openChecklistEditor()">☑️ Редактировать чек-лист (${checklist.length})</button>
      ${content.length?`<div style="margin-top:10px">${content.map((c,i)=>`<div class="ar">
        <div class="arn">${i+1}</div>
        <div class="arb"><span class="ctt ct-${c.type}">${c.type}</span>${eh(c.type==='ul'?(c.items||[]).join(' • ').slice(0,60):c.type==='term'?c.term:c.type==='card'?c.q:c.type==='image'?'[картинка]':c.text.slice(0,80))}…</div>
        <div class="ara"><button onclick="openContentEditor('${c.id}')">✏️</button><button class="dg" onclick="deleteContent('${c.id}')">🗑</button></div>
      </div>`).join('')}</div>`:''}
    </div>`;
  }

  if (checklist.length) {
    h += `<div class="c"><div class="m">☑️ Что надо знать</div>
      ${checklist.map((c,i)=>{
        const k = topicId+':'+i;
        return `<div class="cli ${S.checklist[k]?'done':''}" onclick="toggleCl('${topicId}',${i})">
          <div class="clb">✓</div><div class="clt">${eh(c.text)}</div></div>`;
      }).join('')}</div>`;
  }

  h += `<div class="c" id="notes"><div class="m">📝 Мои заметки</div>
    <textarea class="na" id="naField" placeholder="Мои мысли по теме...">${eh(S.notes[topicId]||'')}</textarea>
    <button class="b pr" style="margin-top:8px" onclick="saveNote('${topicId}')">💾 Сохранить</button></div>
    <div class="c"><button class="b bk" onclick="renderMenu()">← Главное меню</button></div>`;
  app.innerHTML = h;
  window.scrollTo(0,0);
}

function renderContent(items) {
  let h = '';
  (items||[]).forEach(c => {
    if (S.compact && c.type !== 'h3' && c.type !== 'key') return;
    if (c.type === 'h3') h += `<h3>${eh(c.text)}</h3>`;
    else if (c.type === 'p') h += `<p>${c.text}</p>`;
    else if (c.type === 'key') h += `<div class="kb">🔑 ${eh(c.text)}</div>`;
    else if (c.type === 'term') h += `<div class="tmb"><b>${eh(c.term)}</b><br>${eh(c.def)}</div>`;
    else if (c.type === 'ul') h += `<ul>${(c.items||[]).map(i=>`<li>${eh(i)}</li>`).join('')}</ul>`;
    else if (c.type === 'image') h += `<img src="${eh(c.image_url)}" alt=""><div class="imc">${eh(c.image_caption||'')}</div>`;
  });
  return h;
}

function toggleCompact() { S.compact = !S.compact; saveLS(); openTopic(S.curTopic.id); }
function scrollNotes() { document.getElementById('notes').scrollIntoView({behavior:'smooth'}); }
function saveNote(id) { S.notes[id] = document.getElementById('naField').value; saveLS(); alert('Заметка сохранена ✅'); }
function toggleCl(tid, idx) { const k = tid+':'+idx; if (S.checklist[k]) delete S.checklist[k]; else S.checklist[k]=true; saveLS(); openTopic(tid); }

function speak() {
  if (!('speechSynthesis' in window)) { alert('Синтез речи не поддерживается'); return; }
  speechSynthesis.cancel();
  let txt = S.curTopic.title + '. ';
  (S.curContent||[]).forEach(c => {
    if (c.type==='h3'||c.type==='p'||c.type==='key') txt += c.text + '. ';
    else if (c.type==='term') txt += c.term + ': ' + c.def + ' ';
    else if (c.type==='ul') txt += (c.items||[]).join('. ') + '. ';
  });
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='ru-RU'; u.rate=1;
  speechSynthesis.speak(u);
  alert('🔊 Чтение началось');
}

// ============================================================
// КАРТОЧКИ
// ============================================================
function startCards() {
  const cards = (S.curContent||[]).filter(c=>c.type==='card').map(c=>({q:c.q,a:c.a}));
  if (!cards.length) { alert('Нет карточек'); return; }
  S.cards = cards.slice().sort(()=>Math.random()-0.5);
  S.ci = 0; S.cs = false;
  renderCard();
}
function renderCard() {
  if (S.ci >= S.cards.length) {
    app.innerHTML = `<div class="c ctr"><h2>🎴 Карточки пройдены</h2><div style="font-size:42px;font-weight:700;margin:10px 0">${S.cards.length}</div></div>
      <div class="c"><button class="b pr" onclick="startCards()">Заново</button><button class="b" onclick="openTopic('${S.curTopic.id}')">← К теме</button></div>`;
    return;
  }
  const c = S.cards[S.ci];
  app.innerHTML = `<div class="tb"><button class="bb" onclick="openTopic('${S.curTopic.id}')">←</button><div class="t">${S.ci+1} / ${S.cards.length}</div></div>
    <div class="fc" onclick="S.cs=!S.cs;renderCard()">
      <div class="fq">${eh(c.q)}</div>
      ${S.cs?`<div class="fa"><b>💡 Ответ:</b><br>${eh(c.a)}</div>`:`<div class="fh">👆 Нажми, чтобы увидеть ответ</div>`}
    </div>
    <div class="c"><button class="b pr" onclick="S.ci++;S.cs=false;renderCard()">${S.ci+1>=S.cards.length?'Завершить':'Следующая →'}</button></div>`;
}

// ============================================================
// РАСПИСАНИЕ
// ============================================================
function renderSchedule() {
  S.screen = 'schedule';
  const today = new Date().getDay();
  let h = `<div class="tb"><button class="bb" onclick="renderMenu()">←</button><div class="t">Расписание</div></div><h1>📅 Расписание</h1>`;
  if (!S.schedule.length) {
    h += `<div class="es"><span class="be">📅</span>Расписание пока не заполнено.</div>`;
  } else {
    S.schedule.forEach(d => {
      const isToday = d.dayIdx === today;
      h += `<div class="sd ${isToday?'td':''}">
        <div class="sdh"><div class="sdt">${eh(d.title)}</div>
          <div class="sdd">${eh(d.date||'')}${isToday?' <span class="bdg td">СЕГОДНЯ</span>':''}</div></div>
        ${(d.lessons||[]).length?d.lessons.map(l=>`<div class="sl"><div class="st">${eh(l.time)}</div><div class="ss2">${eh(l.subj)}</div></div>`).join(''):'<div class="se">Выходной</div>'}
      </div>`;
    });
  }
  if (S.routine.length) {
    h += `<div class="c"><h2>⏰ Распорядок дня</h2>${S.routine.map(r=>`<div class="rr"><div class="rt">${eh(r.time)}</div><div class="rw">${eh(r.what)}</div></div>`).join('')}</div>`;
  }
  h += `<div class="c"><button class="b bk" onclick="renderMenu()">← Главное меню</button></div>`;
  app.innerHTML = h;
}

// ============================================================
// ПОИСК
// ============================================================
function renderSearch() {
  S.screen = 'search';
  app.innerHTML = `<div class="tb"><button class="bb" onclick="renderMenu()">←</button><div class="t">Поиск</div></div><h1>🔍 Поиск</h1>
    <div class="c"><input class="in" id="sq" placeholder="Введи слово..." oninput="doSearch(this.value)"><div id="sr"></div></div>`;
  document.getElementById('sq').focus();
  doSearch('');
}
async function doSearch(q) {
  const r = document.getElementById('sr');
  if (!r) return;
  q = (q||'').trim().toLowerCase();
  if (q.length < 2) { r.innerHTML = `<div class="es"><span class="be">🔎</span>Минимум 2 буквы</div>`; return; }
  const { data: topics } = await sb.from('topics').select('*');
  const { data: content } = await sb.from('content').select('*');
  const results = [];
  (content||[]).forEach(c => {
    let hay = '';
    if (c.type==='h3'||c.type==='p'||c.type==='key') hay = c.text||'';
    else if (c.type==='term') hay = (c.term||'')+' '+(c.def||'');
    else if (c.type==='ul') hay = (c.items||[]).join(' ');
    else if (c.type==='card') hay = (c.q||'')+' '+(c.a||'');
    if (hay.toLowerCase().includes(q)) {
      const t = (topics||[]).find(x=>x.id===c.topic_id);
      if (t) results.push({ topicId: t.id, topicTitle: t.title, text: hay.slice(0, 120) });
    }
  });
  if (!results.length) { r.innerHTML = `<div class="es">😕 Ничего не найдено</div>`; return; }
  r.innerHTML = `<div class="m">Найдено: ${results.length}</div>` + results.slice(0,30).map(x=>`<div class="ic2 cl" onclick="openTopic('${x.topicId}')"><div class="it">${eh(x.topicTitle)}</div><div class="is">${eh(x.text)}</div></div>`).join('');
}

// ============================================================
// АДМИНКА: ВХОД / ВЫХОД
// ============================================================
function toggleAdmin() {
  if (S.session) {
    if (confirm('Выйти из режима редактирования?')) {
      sb.auth.signOut().then(() => { S.session = null; renderMenu(); });
    }
  } else {
    showModal(`<h3>🔒 Вход для администратора</h3>
      <label class="lbl">Email</label>
      <input class="in" id="ae" value="admin@konspekt.local">
      <label class="lbl">Пароль</label>
      <input class="in" id="ap" type="password">
      <div class="ma"><button class="b" onclick="closeModal()">Отмена</button><button class="b pr" onclick="doAdminLogin()">Войти</button></div>`);
  }
}
async function doAdminLogin() {
  const email = document.getElementById('ae').value.trim();
  const pass = document.getElementById('ap').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { alert('Ошибка: ' + error.message); return; }
  S.session = data.session;
  closeModal();
  renderMenu();
}

// ============================================================
// АДМИНКА: БЛОКИ
// ============================================================
function openBlockEditor(blockId) {
  const b = blockId ? S.blocks.find(x=>x.id===blockId) : null;
  showModal(`<h3>${blockId?'Редактировать':'Новый'} раздел</h3>
    <label class="lbl">Название</label><input class="in" id="bn" value="${eh(b?.name||'')}" placeholder="Правовая подготовка">
    <label class="lbl">Иконка (эмодзи)</label><input class="in" id="bi" value="${eh(b?.icon||'📘')}" placeholder="📘">
    <label class="lbl">Описание</label><input class="in" id="bd" value="${eh(b?.description||'')}">
    <label class="lbl">Порядок (число)</label><input class="in" id="bo" type="number" value="${b?.order_index||0}">
    <div class="ma"><button class="b" onclick="closeModal()">Отмена</button><button class="b pr" onclick="saveBlock('${blockId||''}')">Сохранить</button></div>`);
}
async function saveBlock(id) {
  const p = { name: document.getElementById('bn').value.trim(), icon: document.getElementById('bi').value.trim()||'📘', description: document.getElementById('bd').value.trim(), order_index: parseInt(document.getElementById('bo').value)||0 };
  if (!p.name) { alert('Название обязательно'); return; }
  const r = id ? await sb.from('blocks').update(p).eq('id',id) : await sb.from('blocks').insert(p);
  if (r.error) { alert('Ошибка: '+r.error.message); return; }
  closeModal();
  if (S.curBlock) openBlock(S.curBlock.id); else renderMenu();
}
async function deleteBlock(id) {
  if (!confirm('Удалить раздел со всеми темами? Необратимо.')) return;
  await sb.from('blocks').delete().eq('id',id);
  S.curBlock = null;
  renderMenu();
}

// ============================================================
// АДМИНКА: ТЕМЫ
// ============================================================
function openTopicEditor(topicId) {
  let t = null;
  if (topicId) t = (S.curBlock && S.curBlock.topics) ? S.curBlock.topics.find(x=>x.id===topicId) : null;
  showModal(`<h3>${topicId?'Редактировать':'Новая'} тема</h3>
    <label class="lbl">Заголовок</label><input class="in" id="tt" value="${eh(t?.title||'')}">
    <label class="lbl">Подзаголовок</label><input class="in" id="ts" value="${eh(t?.subtitle||'')}">
    <label class="lbl">Порядок</label><input class="in" id="to" type="number" value="${t?.order_index||0}">
    <div class="ma"><button class="b" onclick="closeModal()">Отмена</button><button class="b pr" onclick="saveTopic('${topicId||''}')">Сохранить</button></div>`);
}
async function saveTopic(id) {
  const p = { block_id: S.curBlock.id, title: document.getElementById('tt').value.trim(), subtitle: document.getElementById('ts').value.trim(), order_index: parseInt(document.getElementById('to').value)||0 };
  if (!p.title) { alert('Заголовок обязателен'); return; }
  const r = id ? await sb.from('topics').update(p).eq('id',id) : await sb.from('topics').insert(p);
  if (r.error) { alert('Ошибка: '+r.error.message); return; }
  closeModal();
  if (S.curTopic && id === S.curTopic.id) { S.curTopic.title = p.title; S.curTopic.subtitle = p.subtitle; openTopic(S.curTopic.id); }
  else openBlock(S.curBlock.id);
}
async function deleteTopic(id) {
  if (!confirm('Удалить тему со всем содержимым?')) return;
  await sb.from('topics').delete().eq('id',id);
  if (S.curTopic && S.curTopic.id===id) S.curTopic = null;
  openBlock(S.curBlock.id);
}

// ============================================================
// АДМИНКА: КОНТЕНТ
// ============================================================
function openContentEditor(contentId) {
  let c = null;
  if (contentId) c = (S.curContent||[]).find(x=>x.id===contentId);
  const type = c?.type || 'p';
  let fields = `<label class="lbl">Тип блока</label>
    <select class="in" id="ct" onchange="renderContentFields()">
      <option value="h3" ${type==='h3'?'selected':''}>Заголовок (H3)</option>
      <option value="p" ${type==='p'?'selected':''}>Абзац</option>
      <option value="key" ${type==='key'?'selected':''}>Ключевой тезис</option>
      <option value="term" ${type==='term'?'selected':''}>Термин</option>
      <option value="ul" ${type==='ul'?'selected':''}>Список</option>
      <option value="card" ${type==='card'?'selected':''}>Карточка (вопрос-ответ)</option>
      <option value="image" ${type==='image'?'selected':''}>Картинка</option>
    </select>
    <div id="cf"></div>
    <div class="ma"><button class="b" onclick="closeModal()">Отмена</button><button class="b pr" onclick="saveContent('${contentId||''}')">Сохранить</button></div>`;
  showModal(`<h3>${contentId?'Редактировать':'Новый'} блок</h3>${fields}`);
  window.__c = c;
  renderContentFields();
}
function renderContentFields() {
  const t = document.getElementById('ct').value;
  const c = window.__c || {};
  const f = document.getElementById('cf');
  if (t==='h3'||t==='p'||t==='key') {
    f.innerHTML = `<label class="lbl">Текст</label><textarea class="ta" id="cfText">${eh(c.text||'')}</textarea>`;
  } else if (t==='term') {
    f.innerHTML = `<label class="lbl">Термин</label><input class="in" id="cfTerm" value="${eh(c.term||'')}">
      <label class="lbl">Определение</label><textarea class="ta" id="cfDef">${eh(c.def||'')}</textarea>`;
  } else if (t==='ul') {
    f.innerHTML = `<label class="lbl">Пункты (каждый с новой строки)</label>
      <textarea class="ta" id="cfItems" style="min-height:140px">${eh((c.items||[]).join('\n'))}</textarea>`;
  } else if (t==='card') {
    f.innerHTML = `<label class="lbl">Вопрос</label><input class="in" id="cfQ" value="${eh(c.q||'')}">
      <label class="lbl">Ответ</label><textarea class="ta" id="cfA">${eh(c.a||'')}</textarea>`;
  } else if (t==='image') {
    f.innerHTML = `<label class="lbl">URL картинки</label><input class="in" id="cfImg" value="${eh(c.image_url||'')}" placeholder="https://...">
      <div class="up-box" onclick="document.getElementById('cfFile').click()">📷 Или загрузить файл с устройства</div>
      <input type="file" id="cfFile" accept="image/*" style="display:none" onchange="uploadContentImage(this)">
      <label class="lbl">Подпись</label><input class="in" id="cfCap" value="${eh(c.image_caption||'')}">`;
  }
}
async function uploadContentImage(input) {
  const file = input.files[0];
  if (!file) return;
  const fn = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const { data, error } = await sb.storage.from('konspekt-images').upload(fn, file);
  if (error) { alert('Ошибка загрузки: ' + error.message); return; }
  const { data: pub } = sb.storage.from('konspekt-images').getPublicUrl(fn);
  document.getElementById('cfImg').value = pub.publicUrl;
  alert('✅ Картинка загружена');
}
async function saveContent(id) {
  const t = document.getElementById('ct').value;
  const p = { topic_id: S.curTopic.id, type: t, order_index: 0 };
  if (t==='h3'||t==='p'||t==='key') p.text = document.getElementById('cfText').value;
  else if (t==='term') { p.term = document.getElementById('cfTerm').value; p.def = document.getElementById('cfDef').value; }
  else if (t==='ul') p.items = document.getElementById('cfItems').value.split('\n').map(x=>x.trim()).filter(Boolean);
  else if (t==='card') { p.q = document.getElementById('cfQ').value; p.a = document.getElementById('cfA').value; }
  else if (t==='image') { p.image_url = document.getElementById('cfImg').value; p.image_caption = document.getElementById('cfCap').value; }
  const r = id ? await sb.from('content').update(p).eq('id',id) : await sb.from('content').insert(p);
  if (r.error) { alert('Ошибка: '+r.error.message); return; }
  closeModal();
  openTopic(S.curTopic.id);
}
async function deleteContent(id) {
  if (!confirm('Удалить блок?')) return;
  await sb.from('content').delete().eq('id',id);
  openTopic(S.curTopic.id);
}

// ============================================================
// АДМИНКА: ЧЕК-ЛИСТ
// ============================================================
function openChecklistEditor() {
  const items = S.curChecklist || [];
  showModal(`<h3>☑️ Чек-лист «Что надо знать»</h3>
    <div class="ib">Каждый пункт — с новой строки</div>
    <textarea class="ta" id="clText" style="min-height:200px">${items.map(x=>eh(x.text)).join('\n')}</textarea>
    <div class="ma"><button class="b" onclick="closeModal()">Отмена</button><button class="b pr" onclick="saveChecklist()">Сохранить</button></div>`);
}
async function saveChecklist() {
  const lines = document.getElementById('clText').value.split('\n').map(x=>x.trim()).filter(Boolean);
  await sb.from('checklist').delete().eq('topic_id', S.curTopic.id);
  if (lines.length) {
    await sb.from('checklist').insert(lines.map((t,i)=>({topic_id:S.curTopic.id, text:t, order_index:i})));
  }
  closeModal();
  openTopic(S.curTopic.id);
}

// ============================================================
// АДМИНКА: РАСПИСАНИЕ И РАСПОРЯДОК
// ============================================================
function openScheduleEditor() {
  const text = JSON.stringify(S.schedule, null, 2);
  showModal(`<h3>📅 Расписание (JSON)</h3>
    <div class="ib">Формат:<br><code>[{"dayIdx":1,"title":"Понедельник","date":"13.10.2026","lessons":[{"time":"09:30-11:00","subj":"Физ.подг."}]}]</code><br><br>dayIdx: 0=Вс, 1=Пн, 2=Вт, 3=Ср, 4=Чт, 5=Пт, 6=Сб</div>
    <textarea class="ta" id="schText" style="min-height:300px;font-family:monospace;font-size:13px">${eh(text)}</textarea>
    <div class="ma"><button class="b" onclick="closeModal()">Отмена</button><button class="b pr" onclick="saveSchedule()">Сохранить</button></div>`);
}
async function saveSchedule() {
  try {
    const v = JSON.parse(document.getElementById('schText').value);
    const r = await sb.from('settings').upsert({key:'schedule', value:v, updated_at:new Date().toISOString()});
    if (r.error) { alert('Ошибка: '+r.error.message); return; }
    S.schedule = v;
    closeModal();
    renderMenu();
  } catch(e) { alert('Неверный JSON: ' + e.message); }
}
function openRoutineEditor() {
  const text = JSON.stringify(S.routine, null, 2);
  showModal(`<h3>⏰ Распорядок дня (JSON)</h3>
    <div class="ib">Формат:<br><code>[{"time":"09:00","what":"Прибытие в ЦПП"}]</code></div>
    <textarea class="ta" id="rtText" style="min-height:300px;font-family:monospace;font-size:13px">${eh(text)}</textarea>
    <div class="ma"><button class="b" onclick="closeModal()">Отмена</button><button class="b pr" onclick="saveRoutine()">Сохранить</button></div>`);
}
async function saveRoutine() {
  try {
    const v = JSON.parse(document.getElementById('rtText').value);
    const r = await sb.from('settings').upsert({key:'routine', value:v, updated_at:new Date().toISOString()});
    if (r.error) { alert('Ошибка: '+r.error.message); return; }
    S.routine = v;
    closeModal();
    renderMenu();
  } catch(e) { alert('Неверный JSON: ' + e.message); }
}

// СТАРТ
init();
</script>
</body>
